<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resgatar Key de 6 Horas</title>
<style>
:root{--bg:#090909;--panel:#151515;--orange:#ff791f;--muted:#aaa}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#261308 0,#090909 42%);color:#fff;font:16px system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
main{width:min(540px,100%);background:#111;border:1px solid #3a2417;border-radius:24px;padding:25px;box-shadow:0 18px 60px #0009}
.logo{font-weight:900;letter-spacing:2px;color:var(--orange);font-size:14px}.pill{display:inline-block;border:1px solid #58351e;border-radius:999px;padding:7px 12px;color:#ffc29b;font-size:12px;margin:14px 0}
h1{font-size:30px;line-height:1.1;margin:8px 0 12px}p{color:#ccc;line-height:1.55}
.count{margin:20px 0;background:#21170f;border:1px solid #553016;border-radius:16px;padding:17px;text-align:center}
.count strong{display:block;font-size:31px;color:var(--orange)}.count span{font-size:12px;color:#d5b7a1;letter-spacing:1px}
.buttons{display:grid;gap:11px;margin-top:20px}button{border:0;border-radius:13px;padding:15px;font-weight:800;font-size:16px;cursor:pointer}
#yes,#copy{background:var(--orange);color:#1a0b03}#no,#again{background:#282828;color:white;border:1px solid #444}
.status{margin-top:14px;color:#ffb78a;white-space:pre-wrap;line-height:1.5}.keybox{display:none;margin-top:18px;padding:15px;background:#0b0b0b;border:1px solid #ff791f;border-radius:14px}
.keyvalue{font-size:17px;overflow-wrap:anywhere;color:#fff;margin:10px 0;font-weight:800;user-select:all}

</style></head>
<body><main>
<div class="logo">FFH4X • ACCESS</div><div class="pill">KEY PREMIUM · 6 HORAS</div>
<h1>Resgatar sua Key</h1><p id="intro">Deseja resgatar sua key de 6 horas? Confirme abaixo para continuar pelo encurtador.</p>
<div class="count"><strong id="count">—</strong><span>KEYS DISPONÍVEIS</span></div>
<div class="buttons" id="choice"><button id="yes">SIM, QUERO RESGATAR</button><button id="no">NÃO, AGORA NÃO</button></div>
<div class="keybox" id="keybox"><strong>SUA KEY ESTÁ PRONTA</strong><div class="keyvalue" id="keyvalue"></div><button id="copy">COPIAR KEY</button><button id="again">Voltar ao início</button></div>
<div class="status" id="status" role="status"></div>

</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,get,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const $=s=>document.querySelector(s);let currentKey='';
const SAVED_KEY='mx_delivered_key_v1';
function showDeliveredKey(key){
 currentKey=String(key||'');
 if(!currentKey)return false;
 $('#keyvalue').textContent=currentKey;
 $('#keybox').style.display='block';
 $('#choice').style.display='none';
 $('#intro').textContent='Pronto! Copie sua Key abaixo e use-a no produto.';
 return true;
}
function restoreDeliveredKey(){
 const saved=sessionStorage.getItem(SAVED_KEY);
 if(saved){showDeliveredKey(saved);return true;}
 return false;
}
const isAvailable=v=>v && v.status!=='redeemed' && v.redeemed!==true;
function updateCount(data){const vals=Object.values(data||{});$('#count').textContent=vals.filter(isAvailable).length.toLocaleString('pt-BR');}
onValue(ref(db,'keys'),snap=>updateCount(snap.val()),err=>{$('#count').textContent='—';$('#status').textContent='Não foi possível consultar as Keys. Verifique a conexão e as regras do Firebase.';});
async function waitForConnection(timeoutMs=10000){
 const connectedRef=ref(db,'.info/connected');
 return await new Promise((resolve,reject)=>{
  let done=false;
  const unsub=onValue(connectedRef,snap=>{
   if(snap.val()===true&&!done){done=true;unsub();resolve(true);}
  },err=>{if(!done){done=true;unsub();reject(err);}});
  setTimeout(()=>{if(!done){done=true;unsub();reject(new Error('O Firebase não conectou. Confira internet e URL do banco.'));}},timeoutMs);
 });
}
async function claimKey(){
 // Se a Key já foi entregue nesta aba, mostre a mesma novamente em vez de consumir outra.
 if(restoreDeliveredKey())return;
 if(sessionStorage.getItem('key_claimed_this_session')==='1'){
  // Compatibilidade com versões anteriores que salvavam apenas a flag, sem salvar a Key.
  sessionStorage.removeItem('key_claimed_this_session');
 }

 try{
  let lastError=null;
  for(let attempt=1;attempt<=3;attempt++){
   try{
    await waitForConnection();
    const snap=await get(ref(db,'keys'));
    const data=snap.val()||{};
    const entries=Object.entries(data).filter(([,v])=>isAvailable(v));
    if(!entries.length){$('#status').textContent='No momento não há Keys disponíveis. Tente novamente mais tarde.';return;}
    for(const [id,record] of entries){
     try{
      const result=await runTransaction(ref(db,'keys/'+id),current=>{
       if(!isAvailable(current))return;
       return {...current,status:'redeemed',redeemed:true,redeemedAt:Date.now()};
      },{applyLocally:false});
      if(result.committed){
       currentKey=String(result.snapshot.val()?.key||record.key||id);
       // Salva a Key antes de atualizar a tela: refresh/retorno não consome uma segunda Key.
       sessionStorage.setItem(SAVED_KEY,currentKey);
       sessionStorage.setItem('key_claimed_this_session','1');
       showDeliveredKey(currentKey);
       $('#status').textContent='';return;
      }
     }catch(e){lastError=e;break;}
    }
    if(lastError)throw lastError;
    $('#status').textContent='As Keys disponíveis foram alteradas enquanto você tentava resgatar. Tentando novamente...';
   }catch(e){lastError=e;if(attempt<3){$('#status').textContent=`Conexão interrompida (tentativa ${attempt}/3). Tentando novamente...`;await new Promise(r=>setTimeout(r,800*attempt));}}
  }
  $('#status').textContent='Não foi possível reservar a Key após 3 tentativas. Verifique se o site e o Painel ADM usam o mesmo Firebase, se as regras foram publicadas e se a conexão está estável.'+(lastError?' Detalhe: '+lastError.message:'');
 }catch(e){$('#status').textContent='Erro ao conectar ao Firebase: '+e.message;}
}
function returnedFromShortener(){return sessionStorage.getItem('waiting_for_shortener')==='1'}
function startReturnFlow(){
 if(restoreDeliveredKey())return;
 if(returnedFromShortener()){sessionStorage.removeItem('waiting_for_shortener');claimKey();}
}
$('#yes').onclick=async()=>{
 try{const snap=await get(ref(db,'settings/shortenerUrl'));const url=String(snap.val()||'').trim();
  if(!/^https?:\/\//i.test(url)){$('#status').textContent='O administrador ainda não configurou um link válido do Alpha Rede.';return}
  sessionStorage.setItem('waiting_for_shortener','1');
  // Pass return URL as a query parameter when the shortener accepts it.
  const target=new URL(url);target.searchParams.set('return_url',location.href.split('#')[0]);
  location.href=target.toString();
 }catch(e){$('#status').textContent='Não foi possível abrir o encurtador: '+e.message}
};
$('#no').onclick=()=>{$('#choice').style.display='none';$('#status').textContent='Tudo bem! Você pode voltar quando quiser.'};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(currentKey);$('#status').textContent='Key copiada!'}catch(e){const r=document.createRange();r.selectNodeContents($('#keyvalue'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#status').textContent='Selecione a Key e copie manualmente.'}};
$('#again').onclick=()=>{sessionStorage.removeItem('key_claimed_this_session');sessionStorage.removeItem(SAVED_KEY);$('#keybox').style.display='none';$('#choice').style.display='grid';$('#intro').textContent='Deseja resgatar sua key de 6 horas? Confirme abaixo para continuar pelo encurtador.';$('#status').textContent='';currentKey=''};
window.addEventListener('pageshow',startReturnFlow);
if(!restoreDeliveredKey() && returnedFromShortener())startReturnFlow();
</script></body></html>
